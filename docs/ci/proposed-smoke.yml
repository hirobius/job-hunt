# Post-deploy smoke test (#595). Copy to .github/workflows/smoke.yml (agents never edit
# .github/workflows: Adrian copies it, see docs/ci/smoke-and-rollback.md).
# Runs `npm run smoke` against https://roleflame.vercel.app after each successful Vercel
# production deploy (Vercel's GitHub app posts a deployment_status), and on manual start.
# A failure opens (or comments on) one issue labelled `smoke-failure`, which GitHub pushes to
# the repo's watchers. The image is the pinned one from e2e/visual-env.json (keep them equal;
# src/smokeConfig.test.ts checks it).
name: smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check (default: production)'
        required: false
        default: 'https://roleflame.vercel.app'

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    env:
      HOME: /root
      CI: '1'
      SMOKE_URL: ${{ inputs.url || 'https://roleflame.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit Vercel deployed (the deployment's sha), so the spec matches the build.
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          HDS_PACKAGES_TOKEN: ${{ secrets.HDS_PACKAGES_TOKEN }}
      # Vercel moves the alias as it marks the deploy ready; give the edge a short beat.
      - run: sleep 20
      - run: npm run smoke
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
        # curl and node are in the image, so the alert needs no extra install.
        run: |
          body=$(node -e 'console.log(JSON.stringify(process.argv[1]))' "The post-deploy smoke test failed on $SMOKE_URL for commit $SHA.

          Run: $RUN_URL

          Rollback: Vercel > roleflame > Deployments > the previous Production deployment > ... > Instant Rollback.
          Runbook: docs/ci/smoke-and-rollback.md")
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          curl -sS "${auth[@]}" -X POST "$API/labels" \
            -d '{"name":"smoke-failure","color":"B60205","description":"Post-deploy smoke test failed"}' > /dev/null || true
          open=$(curl -sSf "${auth[@]}" "$API/issues?labels=smoke-failure&state=open&per_page=1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);console.log(a[0]?a[0].number:"")})')
          if [ -n "$open" ]; then
            curl -sSf "${auth[@]}" -X POST "$API/issues/$open/comments" -d "{\"body\":$body}" > /dev/null
          else
            curl -sSf "${auth[@]}" -X POST "$API/issues" \
              -d "{\"title\":\"Production smoke test failed\",\"labels\":[\"smoke-failure\"],\"body\":$body}" > /dev/null
          fi
