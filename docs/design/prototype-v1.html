<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apply Board — Preview (redesign prototype)</title>
<style>
/* ============ HDS-style tokens (jade is the only brand override) ============ */
:root{
  --jade:#0a8a5f; --jade-strong:#077a53; --jade-tint:#e3f3ec; --jade-on:#ffffff;
  --bg:#f4f4f1; --page:#ffffff; --surface:#f5f5f2; --surface-2:#ececea;
  --border:#e0e0db; --border-strong:#c9c9c2;
  --text:#17191c; --text-2:#5a5e63; --text-3:#8a8e93;
  --warn-bg:#fdf3e0; --warn-text:#7a5510;
  --danger:#b3261e; --danger-bg:#fbeae9;
  --st-applied-bg:#e4ebfd; --st-applied:#2b4acb;
  --st-interview-bg:#efe7fb; --st-interview:#6a3ec9;
  --st-offer-bg:#e0f2e7; --st-offer:#157347;
  --st-saved-bg:#fdf0dc; --st-saved:#8a5a00;
  --shadow:0 12px 40px rgba(20,22,20,.22);
  --radius:14px;
}
html[data-theme="dark"]{
  --jade:#12a873; --jade-strong:#12a873; --jade-tint:#14352a; --jade-on:#06231a;
  --bg:#000000; --page:#101112; --surface:#1b1c1d; --surface-2:#242526;
  --border:#2e3032; --border-strong:#45484a;
  --text:#f2f2ef; --text-2:#b3b6ba; --text-3:#83878c;
  --warn-bg:#3a2f16; --warn-text:#f0cd7e;
  --danger:#ff9d97; --danger-bg:#3d1d1b;
  --st-applied-bg:#1d2a52; --st-applied:#a9bdf5;
  --st-interview-bg:#2e2050; --st-interview:#cdb4f7;
  --st-offer-bg:#173a28; --st-offer:#8ed9ae;
  --st-saved-bg:#3a2c10; --st-saved:#f2cd82;
  --shadow:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  font-family:"Satoshi",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
input,textarea,select{font:inherit; color:inherit}
a{color:var(--jade-strong)}
:focus-visible{outline:2px solid var(--jade); outline-offset:2px; border-radius:6px}

/* ============ App frame: single column everywhere ============ */
#app{position:relative; max-width:430px; margin:0 auto; background:var(--page); min-height:100dvh; display:flex; flex-direction:column; overflow:hidden}
@media(min-width:480px){ #app{border-left:1px solid var(--border); border-right:1px solid var(--border); height:100dvh} }
@media(max-width:479px){ #app{height:100dvh} }
main{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:0 16px 28px; scroll-padding-top:12px}
main.no-pad{padding:0 0 28px}
main.no-pad .px{padding-left:16px; padding-right:16px}

/* ============ Header + primary nav ============ */
header.app{padding:14px 16px 0; display:flex; align-items:center; gap:10px}
.logo{font-size:23px; font-weight:800; letter-spacing:-.02em; white-space:nowrap}
.logo b{color:var(--jade); font-weight:800}
.sync{margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--text-2); font-size:14px; padding:8px 6px; border-radius:8px; white-space:nowrap}
.sync .dot{width:8px; height:8px; border-radius:50%; background:var(--border-strong)}
.icon-btn{width:40px; height:40px; display:grid; place-items:center; border-radius:10px; font-size:19px; color:var(--text); flex:none}
.icon-btn:active{background:var(--surface)}
nav.tabs{display:flex; gap:4px; padding:8px 16px 10px; border-bottom:1px solid var(--border)}
nav.tabs a{flex:1; text-align:center; text-decoration:none; color:var(--text-2); font-size:15px; padding:8px 0; border-radius:9px}
nav.tabs a[aria-current]{color:var(--text); font-weight:700; background:var(--surface)}
html[data-theme="dark"] nav.tabs a[aria-current]{background:var(--surface-2)}

/* ============ Generic ============ */
h1{font-size:22px; line-height:1.2; letter-spacing:-.01em; margin:0}
h2{font-size:17px; margin:0}
.small{font-size:13px} .muted{color:var(--text-2)} .faint{color:var(--text-3)}
.row{display:flex; align-items:center; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:11px; padding:0 16px; min-height:46px; font-weight:600; font-size:15px; border:1px solid transparent; text-decoration:none; white-space:nowrap}
.btn-jade{background:var(--jade); color:var(--jade-on)}
.btn-jade:active{background:var(--jade-strong)}
.btn-outline{border-color:var(--border-strong); color:var(--text); background:var(--page)}
.btn-ghost{color:var(--text-2); min-height:40px; padding:0 10px}
.btn-sm{min-height:38px; padding:0 13px; font-size:14px; border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}
.field{width:100%; background:var(--page); border:1px solid var(--border-strong); border-radius:11px; padding:12px 13px; font-size:15px}
.field::placeholder{color:var(--text-3)}
textarea.field{resize:none; line-height:1.5}
label.lab{display:block; font-size:13px; color:var(--text-2); margin:16px 0 6px}
label.lab:first-child{margin-top:0}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-strong); background:var(--page); border-radius:999px; padding:7px 12px; font-size:14px; white-space:nowrap}
.chip[aria-pressed="true"], .chip.on{background:var(--jade); border-color:var(--jade); color:var(--jade-on); font-weight:600}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap; overflow:visible}
.seg{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:3px; gap:3px}
.seg button{flex:1; padding:8px 4px; border-radius:8px; font-size:14px; color:var(--text-2); white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--page); color:var(--text); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.10)}
html[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--surface-2)}
.card{background:var(--page); border:1px solid var(--border); border-radius:var(--radius); padding:14px}
.divider{height:1px; background:var(--border); margin:16px 0}

/* Status chips */
.st{display:inline-flex; align-items:center; border-radius:999px; padding:3px 9px; font-size:12.5px; font-weight:600; white-space:nowrap}
.st-applied{background:var(--st-applied-bg); color:var(--st-applied)}
.st-interviewing{background:var(--st-interview-bg); color:var(--st-interview)}
.st-offer{background:var(--st-offer-bg); color:var(--st-offer)}
.st-saved{background:var(--st-saved-bg); color:var(--st-saved)}
.st-closed,.st-rejected{background:var(--surface-2); color:var(--text-2)}
.next-due{font-size:12.5px; font-weight:600; background:var(--warn-bg); color:var(--warn-text); border-radius:999px; padding:3px 9px; white-space:nowrap}
.next-ok{font-size:12.5px; color:var(--text-2); white-space:nowrap}

/* ============ Tracker ============ */
.addbar{display:flex; gap:8px; margin-top:14px}
.addbar .field{flex:1}
.sample-note{margin-top:12px; background:var(--st-applied-bg); color:var(--text); border-radius:11px; padding:10px 12px; font-size:13.5px; display:flex; justify-content:space-between; gap:10px; align-items:center}
html[data-theme="dark"] .sample-note{background:#1d2a52}
.sample-note button{font-weight:600; text-decoration:underline; white-space:nowrap}
.filters{display:flex; gap:8px; margin-top:14px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.filters .chip .n{opacity:.75; font-weight:400}
.toolbar{display:flex; gap:6px; align-items:center; margin-top:10px}
.toolbar .search{flex:1; position:relative}
.toolbar .search .field{padding-left:36px}
.toolbar .search span{position:absolute; left:12px; top:50%; translate:0 -50%; color:var(--text-3); font-size:15px}
.nextup{margin-top:16px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden}
.nextup>button.head{width:100%; display:flex; justify-content:space-between; align-items:center; padding:13px 14px; font-weight:700; font-size:15px; background:var(--surface); text-align:left}
.nextup .item{display:flex; gap:10px; padding:12px 14px; border-top:1px solid var(--border); align-items:flex-start; width:100%; text-align:left}
.nextup .item:active{background:var(--surface)}
.nextup .when{flex:none; width:64px; font-size:12.5px; color:var(--text-2); padding-top:2px}
.nextup .item .t{font-weight:600}
.overdue{color:var(--danger); font-weight:700}
.job{display:block; width:100%; text-align:left; border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; margin-top:10px; background:var(--page)}
.job:active{background:var(--surface)}
.job .top{display:flex; gap:11px; align-items:flex-start}
.avatar{width:38px; height:38px; flex:none; border-radius:10px; background:var(--surface-2); color:var(--text-2); display:grid; place-items:center; font-weight:700; font-size:13px}
.job .title{font-weight:700; font-size:15.5px; line-height:1.25}
.job .sub{color:var(--text-2); font-size:13.5px; margin-top:1px}
.job .meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; align-items:center}
.job .cta{margin-top:11px}
.pin{color:var(--jade); font-size:14px}
.kebab{width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:9px; font-size:18px; color:var(--text-2)}
.empty{padding:34px 4px 8px; text-align:left}
.empty h2{font-size:17px; margin-bottom:6px}
.empty p{color:var(--text-2); margin:0 0 18px}
.empty .row{gap:8px}

/* ============ Job page ============ */
.backbar{display:flex; align-items:center; justify-content:space-between; padding-top:12px}
.nextcard{margin-top:14px; border:1px solid var(--border); border-radius:var(--radius); padding:14px; background:var(--surface)}
.listrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-top:10px; background:var(--page)}
.listrow:active{background:var(--surface)}
.listrow .grow{flex:1; min-width:0}
.listrow .sum{color:var(--text-2); font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.listrow .chev{color:var(--text-3); font-size:18px}
.stickybar{position:sticky; bottom:0; margin:18px -16px -28px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--page); border-top:1px solid var(--border)}

/* ============ Templates ============ */
.tmpl{border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-top:10px; background:var(--page)}
.tmpl .title{font-weight:700; font-size:15.5px}
.tmpl .prev{color:var(--text-2); font-size:14px; margin-top:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tok{display:inline-flex; border-radius:6px; background:var(--surface-2); color:var(--text-2); font-size:12.5px; padding:2px 7px}
.tok.missing{background:var(--warn-bg); color:var(--warn-text); font-weight:600}

/* ============ Discover ============ */
.trackbtn{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--border-strong); border-radius:11px; padding:12px 13px; background:var(--page); font-weight:600; text-align:left; margin-top:14px}
.linkrow{display:flex; gap:10px; align-items:center; border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; margin-top:10px; background:var(--page); width:100%; text-align:left}
.linkrow:active{background:var(--surface)}
.badge{font-size:12px; font-weight:700; border-radius:999px; padding:3px 8px; background:var(--jade-tint); color:var(--jade-strong); white-space:nowrap}
html[data-theme="dark"] .badge{color:#7fe0b8}
.posting{border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-top:10px; background:var(--page)}
.posting .title{font-weight:700; font-size:15.5px; line-height:1.3}
.posting .snip{color:var(--text-2); font-size:14px; margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.trackcard{display:flex; gap:12px; width:100%; text-align:left; border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-top:10px; background:var(--page); align-items:flex-start}
.trackcard[aria-checked="true"]{border-color:var(--jade); border-width:2px; padding:13px; background:var(--jade-tint)}
.checkbox{width:24px; height:24px; flex:none; border-radius:7px; border:2px solid var(--border-strong); display:grid; place-items:center; color:#fff; font-size:15px; margin-top:1px; background:var(--page)}
.trackcard[aria-checked="true"] .checkbox{background:var(--jade); border-color:var(--jade); color:#fff}
.stickyfoot{position:sticky; bottom:0; margin:18px -16px -28px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--page); border-top:1px solid var(--border)}

/* ============ Sheets & dialogs ============ */
.scrim{position:absolute; inset:0; background:rgba(12,14,12,.48); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--page); width:100%; max-height:92%; overflow-y:auto; border-radius:20px 20px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom)); animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px); opacity:.6} to{transform:none; opacity:1}}
.sheet .grab{width:38px; height:4px; border-radius:99px; background:var(--border-strong); margin:2px auto 14px}
.sheet h2{font-size:19px}
.menu-list{margin-top:8px}
.menu-list button, .menu-list a{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 2px; font-size:15.5px; border-bottom:1px solid var(--border); text-decoration:none; color:var(--text)}
.menu-list button:last-child, .menu-list a:last-child{border-bottom:0}
.menu-list .danger{color:var(--danger)}
.dialog-wrap{position:absolute; inset:0; background:rgba(12,14,12,.48); z-index:40; display:flex; align-items:flex-end; justify-content:center}
@media(min-width:480px){ .dialog-wrap{align-items:center; padding:20px} }
.dialog{background:var(--page); width:100%; max-height:92%; overflow-y:auto; border-radius:20px; padding:20px}
@media(max-width:479px){ .dialog{border-radius:20px 20px 0 0} }

/* Toast */
#toast{position:absolute; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); translate:-50% 0; background:var(--text); color:var(--page); padding:11px 18px; border-radius:999px; font-size:14.5px; font-weight:600; z-index:80; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s}
#toast.show{opacity:1}

/* Screen index */
.idx{padding-top:18px}
.idx a.state{display:flex; gap:12px; align-items:baseline; padding:12px 2px; border-bottom:1px solid var(--border); text-decoration:none; color:var(--text)}
.idx .num{font-weight:800; color:var(--jade-strong); width:26px; flex:none}
.idx .chg{color:var(--text-2); font-size:13.5px}
</style>

<style>
/* ===== Elevation pass — Architectural / Meridian House language =====
   Near-neutral surfaces, hairlines instead of boxed shadows, generous padding,
   tight-tracked display type, spec-row rhythm, restraint.
   No embellishments: no accent dash-lines, no decorative graphics.
   Jade remains the single accent (brand override). */
:root{ --radius:10px; --bg:#f7f7f5; --surface:#f7f7f5; --surface-2:#efefec; --border:#e5e5e1; --border-strong:#cfcfc8;
  --text:#141414; --text-2:#525252; --text-3:#8a8a85;
  --shadow:0 10px 15px rgba(0,0,0,.08),0 25px 50px rgba(0,0,0,.12); }
html[data-theme="dark"]{ --bg:#0a0a0a; --page:#111111; --surface:#171717; --surface-2:#1f1f1f; --border:#262626; --border-strong:#3d3d3d;
  --text:#f5f5f2; --text-2:#a8a8a3; --text-3:#7c7c77; }
body{ font-weight:500; }
main{ padding-left:18px; padding-right:18px; }
h1{ letter-spacing:-.025em; line-height:1.08; }
h2{ letter-spacing:-.02em; }
.logo{ letter-spacing:-.02em; font-weight:800; }
.btn{ border-radius:9px; font-weight:600; }
.btn:not(.btn-sm){ min-height:50px; }
.card,.job,.listrow,.tmpl,.linkrow,.posting,.trackcard,.feed-card,.applied-row{ padding:18px; box-shadow:none; }
.hero-card{ padding:22px; border-radius:12px; }
.hero-card .title{ font-size:22px; letter-spacing:-.022em; line-height:1.15; }
.feed-card .title,.job .title,.tmpl .title{ letter-spacing:-.012em; }
.nextcard{ padding:18px; box-shadow:none; }
.field{ border-radius:9px; padding:13px 14px; }
.sheet{ border-radius:16px 16px 0 0; box-shadow:var(--shadow); }
.state{ padding-top:16px; padding-bottom:16px; }
.divider{ margin:22px 0; }
.lab{ letter-spacing:0; }
.nextup{ border-radius:10px; }
.seg{ border-radius:10px; }
.seg button[aria-pressed="true"]{ box-shadow:0 1px 2px rgba(0,0,0,.06); }
</style>
</head>

/* ================= Tracker ================= */
function visibleJobs(){
  let list = S.sample ? JOBS.slice() : [];
  if(S.filter==="Active") list=list.filter(j=>!["Closed","Rejected"].includes(jobState(j).status));
  else if(S.filter!=="All") list=list.filter(j=>jobState(j).status===S.filter);
  if(S.query) list=list.filter(j=>(j.title+" "+j.company+" "+j.loc).toLowerCase().includes(S.query.toLowerCase()));
  if(S.sort==="Follow-up due first") list.sort((a,b)=> (jobState(a).nextKind==="due"?0:1)-(jobState(b).nextKind==="due"?0:1));
  if(S.sort==="A–Z") list.sort((a,b)=>a.title.localeCompare(b.title));
  if(S.sort==="Best fit") list.sort((a,b)=> (a.fit==="Match"?0:1)-(b.fit==="Match"?0:1));
  return list;
}
function counts(){ const all=S.sample?JOBS:[]; const by=st=>all.filter(j=>jobState(j).status===st).length; return {Active:all.filter(j=>!["Closed","Rejected"].includes(jobState(j).status)).length, All:all.length, Saved:by("Saved"), Applied:by("Applied"), Interviewing:by("Interviewing"), Offer:by("Offer"), Rejected:by("Rejected")}; }
function jobCard(j){
  const e=jobState(j);
  const label=primaryLabel(j);
  return `<div class="job" data-act="open-job" data-id="${j.id}" role="button" tabindex="0" aria-label="${esc(j.title)} at ${esc(j.company)}">
    <div class="top">
      <div class="avatar">${j.ini}</div>
      <div style="flex:1;min-width:0">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div class="title">${esc(j.title)}</div>
          <button class="kebab" data-act="rowmenu" data-id="${j.id}" aria-label="Actions for ${esc(j.title)}">⋮</button>
        </div>
        <div class="sub">${esc(j.company)} — ${esc(j.loc)}</div>
        <div class="meta">${statusChip(e.status)} ${nextPill(j)} ${j.pinned?'<span class="pin" title="Pinned">★</span>':""}</div>
        <div class="cta"><button class="btn ${label==="Log follow-up"?"btn-outline":"btn-jade"} btn-sm" data-act="card-primary" data-id="${j.id}">${label}</button></div>

}
function nextUp(expanded){
  const due = JOBS.filter(j=>{const e=jobState(j); return e.nextKind==="due" || /Follow up in/.test(e.next);}).slice(0,3);
  if(!due.length) return "";
  return `<section class="nextup" aria-label="Next up">
    <button class="head" data-act="toggle-overview" aria-expanded="${expanded}">Next up <span>${expanded?"▾":"▸"}</span></button>
    ${expanded? due.map(j=>{const e=jobState(j); return `<button class="item" data-act="open-job" data-id="${j.id}">
      <span class="when ${e.nextKind==="due"?"overdue":""}">${e.nextKind==="due"?"Overdue":esc(e.next.replace("Follow up ",""))}</span>
      <span><span class="t">${esc(j.title)}</span><br><span class="muted small">${/Follow/.test(e.next)?"Follow up":"Next step"} — ${esc(j.company)}</span></span>
    </button>`;}).join("") + `<div style="padding:11px 14px" class="small muted">Due actions only, as shortcuts — the job cards below stay the single full copy. No pipeline or funnel.</div>`:""}
  </section>`;
}

/* ================= Router + actions ================= */
let OV = null; /* {name, id} */
let CUR = "";
function render(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const params = new URLSearchParams(qs||"");
  if(params.get("overlay")) OV = {name: params.get("overlay"), id:"dsl"};
  const p = path || "";
  let html = "";
  if(p==="" ) html = viewIndex();
  else if(p==="tracker-empty"){ S.sample=false; html=viewTracker(OV&&OV.name); }
  else if(p==="tracker/search-none"){ S.sample=true; S.query="zzz"; html=viewTracker(OV&&OV.name); }
  else if(p==="tracker/filter-applied"){ S.filter="Applied"; html=viewTracker(OV&&OV.name); }
  else if(p==="tracker/filter-all"){ S.filter="All"; html=viewTracker(OV&&OV.name); }
  else if(p==="tracker/overview"){ html=viewTracker(OV&&OV.name,{overview:true}); }
  else if(p==="tracker"){ html=viewTracker(OV&&OV.name); }
  else if(p.startsWith("job/")){ const id=p.split("/")[1]; html=viewJob(id, OV&&OV.name); }
  else if(p==="job-missing"){ html=viewMissing() + (OV? overlayHtml(OV.name):""); }
  else if(p==="templates"){ if(OV&&OV.name==="edit"&&!S._tmplId) S._tmplId=S.templates[0].id; html=viewTemplates(OV&&OV.name); }
  else if(p==="discover/setup"){ html=viewSetup(false); }
  else if(p==="discover/setup-picked"){ html=viewSetup(true); }
  else if(p==="discover/links"){ html=viewLinks(OV&&OV.name); }
  else if(p==="discover/search-title"){ html=viewSearch("title", OV&&OV.name); }
  else if(p==="discover/search-boards"){ html=viewSearch("boards", OV&&OV.name); }
  else if(p==="discover/postings"){ html=viewPostings(OV&&OV.name); }
  else html = viewIndex();
  app.innerHTML = html;
  if(CUR !== p){ const m=app.querySelector("main"); if(m) m.scrollTop=0; CUR=p; }
}
window.addEventListener("hashchange", ()=>{ /* overlay param handled in render */ render(); });

document.addEventListener("click", ev=>{
  const segBtn = ev.target.closest(".seg button:not([data-act])");
  if(segBtn){ segBtn.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false")); segBtn.setAttribute("aria-pressed","true"); return; }
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act==="scrim"){ if(ev.target===el){ OV=null; render(); } return; }
  switch(act){
    case "theme": { const cur=document.documentElement.dataset.theme; const nxt=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nxt; try{localStorage.setItem("ab-theme",nxt);}catch(e){} render(); break; }
    case "sync": OV={name:"sync"}; render(); break;
    case "appmenu": OV={name:"appmenu"}; render(); break;
    case "close-overlay": OV=null; render(); break;
    case "goto-index": OV=null; go(""); break;
    case "goto-discover": OV=null; go("discover/links"); break;
    case "goto-setup": OV=null; go("discover/setup"); break;
    case "back-tracker": OV=null; go("tracker"); break;
    case "feedback": OV=null; toast("Feedback form opened"); render(); break;
    case "email-link": OV=null; toast("Sign-in link sent — check your email"); render(); break;
    case "sample": S.sample=true; S.filter="Active"; render(); break;
    case "clear-sample": S.sample=false; OV=null; render(); break;
    case "filter": S.filter=el.dataset.f; render(); break;
    case "clear-search": S.query=""; go("tracker"); render(); break;
    case "toggle-overview": { const on = location.hash.includes("overview"); location.hash = on? "#/tracker" : "#/tracker/overview"; break; }
    case "sort": OV={name:"sort"}; render(); break;
    case "data": OV={name:"data"}; render(); break;
    case "set-sort": S.sort=el.dataset.v; OV=null; toast("Sorted: "+S.sort); render(); break;
    case "data-action": OV=null; toast(el.dataset.v); render(); break;
    case "add-job": {
      const inp=document.getElementById("addurl"); const v=(inp&&inp.value||"").trim();
      if(!v){ toast("Paste a job URL first"); break; }
      let host="example.com"; try{ host=new URL(v).hostname.replace(/^www\./,""); }catch(e){}
      JOBS.unshift({id:"new"+Date.now(), ini:host.slice(0,2).toUpperCase(), title:"Saved role", company:host, loc:"", status:"Saved", next:"Not applied yet", nextKind:"ok", fit:"Match", mode:"Remote", applicants:"—", source:host, pinned:false, contact:"", angle:""});
      S.sample=true; S.filter="Active"; S.query=""; toast("Job added to Tracker"); render(); break; }
    case "rowmenu": OV={name:"rowmenu", id}; render(); break;
    case "toggle-pin": { const j=job(id); j.pinned=!j.pinned; OV=null; toast(j.pinned?"Pinned":"Unpinned"); render(); break; }
    case "retire": { jobState(job(id)).status="Closed"; OV=null; toast("Retired"); render(); break; }
    case "remove-job": { const i=JOBS.findIndex(j=>j.id===id); if(i>=0) JOBS.splice(i,1); OV=null; toast("Removed"); if(location.hash.includes("/job/")) go("tracker"); else render(); break; }
    case "open-job": OV=null; go("job/"+id); break;
    case "card-primary": case "job-primary": {
      const j=job(id); const e=jobState(j); const label=primaryLabel(j);
      if(label==="Reopen"){ e.status="Saved"; e.next="Not applied yet"; e.nextKind="ok"; toast("Reopened as Saved"); render(); }
      else if(label==="Mark applied"){ e.status="Applied"; e.next="Follow-up due"; e.nextKind="due"; toast("Marked as applied"); render(); }
      else if(label==="Add interview"){ OV={name:"interview", id}; render(); }
      else { OV={name:"followup", id}; render(); }
      break; }
    case "open-overlay": OV={name:el.dataset.v, id}; if(el.dataset.v==="template") S._tmplIdx=0; render(); break;
    case "statusmenu": OV={name:"statusmenu", id}; render(); break;
    case "set-status": { const e=jobState(job(id)); e.status=el.dataset.v; if(el.dataset.v==="Saved"){e.next="Not applied yet"; e.nextKind="ok";} OV=null; toast("Status: "+el.dataset.v); render(); break; }
    case "save-followup": { const e=jobState(job(id)); e.next="Follow up in 7d"; e.nextKind="ok"; OV=null; toast("Follow-up logged"); render(); break; }
    case "save-interview": { const e=jobState(job(id)); const d=document.getElementById("iv-date"); const t=document.getElementById("iv-time"); e.interviews.unshift({date:(d&&d.value||"Tue, Oct 14")+(t&&t.value?", "+t.value:""), kind:"Interview"}); OV=null; toast("Interview added to calendar"); render(); break; }
    case "starter-todos": { const e=jobState(job(id)); e.todos.push({text:"Tailor resume to the posting",done:false},{text:"Write outreach note",done:false},{text:"Check the posting is still open",done:false}); render(); break; }
    case "add-todo": { const inp=document.getElementById("new-todo"); if(inp&&inp.value.trim()){ jobState(job(id)).todos.push({text:inp.value.trim(),done:false}); render(); } break; }
    case "save-edit": { const j=job(id); const t=document.getElementById("ed-title"); const c=document.getElementById("ed-contact"); const a=document.getElementById("ed-angle"); if(t&&t.value.trim()) j.title=t.value.trim(); if(c) j.contact=c.value.trim(); if(a) j.angle=a.value.trim(); OV=null; toast("Details saved"); render(); break; }
    case "pick-template": S._tmplIdx=+el.dataset.i; OV={name:"template", id}; render(); break;
    case "copy-template": { const j=job(id); const t=S.templates[S._tmplIdx||0]; let txt=fillTemplate(t,j);
      document.querySelectorAll("[data-missing]").forEach(inp=>{ if(inp.value.trim()) txt=txt.split("["+inp.dataset.missing+"]").join(inp.value.trim()); });
      copyText(txt, "Template copied"); break; }
    case "tmpl-menu": S._tmplId=id; OV={name:"menu"}; render(); break;
    case "tmpl-preview": S._tmplId=id; OV={name:"preview"}; render(); break;
    case "tmpl-copy": { const t=S.templates.find(x=>x.id===id); if(t) copyText(t.body,"Template copied — tokens included"); OV=null; render(); break; }
    case "tmpl-use": OV=null; toast("Open a job, then tap Use a template"); go("tracker"); break;
    case "tmpl-edit-open": S._tmplId=id; OV={name:"edit"}; render(); break;
    case "tmpl-pin": { const t=S.templates.find(x=>x.id===id); t.pinned=!t.pinned; OV=null; toast(t.pinned?"Pinned":"Unpinned"); render(); break; }
    case "tmpl-dup": { const t=S.templates.find(x=>x.id===id); S.templates.push({...t, id:"t"+Date.now(), name:t.name+" copy", pinned:false}); OV=null; toast("Duplicated"); render(); break; }
    case "tmpl-del": { S.templates=S.templates.filter(x=>x.id!==id); OV=null; toast("Template deleted"); render(); break; }
    case "tmpl-new": { const nt={id:"t"+Date.now(), name:"Untitled template", pinned:false, body:"Hi [Contact],\n\n", tokens:["Contact"]}; S.templates.unshift(nt); S._tmplId=nt.id; OV={name:"edit"}; render(); break; }
    case "tmpl-insert": { const b=document.getElementById("te-body"); if(b){ b.value+=el.dataset.v; b.focus(); } break; }
    case "tmpl-save": { const t=S.templates.find(x=>x.id===id); const n=document.getElementById("te-name"); const b=document.getElementById("te-body"); if(n) t.name=n.value; if(b) t.body=b.value; OV=null; toast("Template saved"); render(); break; }
    case "setup-pick": { const k=el.dataset.id; S.setupPicked.has(k)? S.setupPicked.delete(k) : S.setupPicked.add(k); render(); break; }
    case "setup-start": OV=null; go("discover/links"); break;
    case "disc-nav": go("discover/"+el.dataset.v); break;
    case "disc-mode": S.discMode=el.dataset.v; render(); break;
    case "set-term": S.term=el.dataset.v; render(); break;
    case "save-link": { const i=+el.dataset.i; S.savedLinks.has(i)? S.savedLinks.delete(i) : (S.savedLinks.add(i), toast("Link saved")); render(); break; }
    case "save-search": { const v=el.dataset.v; S.savedSearches.has(v)? S.savedSearches.delete(v) : (S.savedSearches.add(v), toast("Search saved")); render(); break; }
    case "save-posting": { const i=+el.dataset.i; if(S.savedPostings.has(i)){ S.savedPostings.delete(i); } else { S.savedPostings.add(i); toast("Saved to Tracker"); } render(); break; }
    case "post-filter": S.postFilter=el.dataset.v; render(); break;
    case "track-sheet": OV={name:"track"}; render(); break;
    case "set-track": S.track=el.dataset.v; OV=null; render(); break;
    case "open-manage": OV={name:"manage"}; render(); break;
    case "remove-term": S.terms=S.terms.filter(t=>t!==el.dataset.v); render(); break;
    case "add-term": { const inp=document.getElementById("new-term"); if(inp&&inp.value.trim()){ S.terms.push(inp.value.trim()); render(); } break; }
  }
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.dataset && el.dataset.actChange==="todo"){ const e=jobState(job(el.dataset.id)); e.todos[+el.dataset.i].done=el.checked; render(); }
  if(el.id==="job-notes"){ jobState(job(el.dataset.id)).notes=el.value; toast("Notes saved"); }
  if(el.id==="q"){ S.query=el.value; render(); const q=document.getElementById("q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
});
document.addEventListener("keydown", ev=>{
  if(ev.key!=="Enter") return;
  if(ev.target.id==="addurl"){ ev.preventDefault(); document.querySelector('[data-act="add-job"]').click(); }
  if(ev.target.id==="new-todo"){ ev.preventDefault(); document.querySelector('[data-act="add-todo"]').click(); }
  if(ev.target.id==="new-term"){ ev.preventDefault(); document.querySelector('[data-act="add-term"]').click(); }
  if(ev.target.classList && ev.target.classList.contains("job") && ev.target.dataset.act==="open-job"){ go("job/"+ev.target.dataset.id); }
});
try{ const th=localStorage.getItem("ab-theme"); if(th) document.documentElement.dataset.theme=th; }catch(e){}
if(!location.hash) location.hash="#/";
render();
function viewMissing(){
  return `<main>${backHeader()}
    <div class="empty" style="text-align:center;padding-top:64px">
      <div style="font-size:34px" aria-hidden="true">⌕</div>
      <h2 class="mt12" style="font-size:19px">This job isn't in your tracker</h2>
      <p>It may have been removed, or the link came from another device that hasn't synced.</p>
      <button class="btn btn-jade btn-block" data-act="back-tracker">Back to Tracker</button>
      <button class="btn btn-outline btn-block mt12" data-act="sync">Sign in to sync</button>
    </div></main>`;
}
</script>
