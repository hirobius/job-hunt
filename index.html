<!doctype html>
<!-- HDS compact density (0.30): the app rhythm, space 4/8/12/16/24/32, body 15. -->
<html lang="en" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- iOS turns plain email text into mailto links; the account menu's email is a label. -->
    <meta name="format-detection" content="email=no" />
    <title>%BRAND_NAME%</title>
    <meta name="description" content="%BRAND_NAME% — %BRAND_DESCRIPTION%" />
    <!-- The browser bar matches the page (HDS surface-page) in each colour scheme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://roleforge-app.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:url" content="https://roleforge-app.vercel.app/" />
    <meta property="og:image" content="https://roleforge-app.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The %BRAND_NAME% flame logo, the name %BRAND_NAME% and the line: %BRAND_DESCRIPTION%"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_NAME%" />
    <meta name="twitter:description" content="%BRAND_DESCRIPTION%" />
    <meta name="twitter:image" content="https://roleforge-app.vercel.app/og-image.png" />
  </head>
  <body data-hds>
    <!-- The boot splash: the flame (Version E, src/brand/flameEngine.ts) burning while the app
         loads. React replaces it the moment it mounts, so a ready app is never held. -->
    <div id="root">
      <div class="rjb-boot" role="status" aria-label="Loading %BRAND_NAME%">
        <span class="rjb-flame">%BRAND_FLAME%</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
