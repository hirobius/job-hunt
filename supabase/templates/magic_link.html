<!--
  roleflame sign-in email (#278). Paste this file into Supabase:
  Authentication > Emails > Templates > Magic link > Message body (source).
  Subject: see supabase/templates/README.md. Pinned by src/authEmailTemplate.test.ts.
  No images, no tracking, no remote assets: plain text-first HTML.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your roleflame sign-in link</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    "
  >
    <p style="margin: 0 0 16px">Sign in to roleflame</p>
    <p style="margin: 0 0 24px">
      Use this link to sign in as {{ .Email }}. It works once and expires in 1 hour.
    </p>
    <p style="margin: 0 0 24px">
      <a
        href="{{ .ConfirmationURL }}"
        style="
          display: inline-block;
          padding: 12px 20px;
          background: #1a1a1a;
          color: #ffffff;
          text-decoration: none;
          border-radius: 8px;
        "
        >Sign in</a
      >
    </p>
    <p style="margin: 0 0 8px; color: #555555; font-size: 14px">
      If the button does not work, copy this link into your browser:
    </p>
    <p style="margin: 0 0 24px; font-size: 14px; word-break: break-all">
      <a href="{{ .ConfirmationURL }}" style="color: #1a1a1a">{{ .ConfirmationURL }}</a>
    </p>
    <p style="margin: 0; color: #555555; font-size: 14px">
      You did not ask for this? Ignore this email. Nobody can sign in without the link.
    </p>
  </body>
</html>
