title = "job-hunt Gitleaks Config"

# Read by scripts/hooks/secret-pii-scan.mjs (the pre-push scan, hirobius/ops#943) and by CI (gitleaks 8.30.1).
# `[[allowlists]]` with `targetRules` needs gitleaks 8.25 or newer.

[extend]
# Use Gitleaks default rules as the baseline
useDefault = true

[[allowlists]]
description = "The pre-push scan's own fixtures"
paths = [
  # The pre-push scan's fixtures hold a fake credential on purpose. The test
  # commits the fixture into a throwaway repo under another path, so it still
  # fires there (src/secretPiiScan.test.ts).
  '''^scripts\/fixtures\/secret-pii-scan\/''',
]

[[allowlists]]
description = "board-keys.json: generated ATS board slugs, never a secret"
# The file is one minified line of slugs. `"headout","linkedin","<slug>"` reads as a LinkedIn client
# secret, and every regeneration (a board added) made a new finding (1a3f4b6, 0dfea02, 0d2d81f,
# adbb381). Only this rule, only this file: any other rule still fires on it.
targetRules = ["linkedin-client-secret"]
paths = ['''^src\/feed\/data\/board-keys\.json$''']
